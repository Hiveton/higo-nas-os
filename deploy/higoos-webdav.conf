# HiGoOS dedicated WebDAV server (Apache httpd, port 8081).
#
# Run as a standalone Apache instance so it never collides with a user's system
# apache2 site. The protocols domain regenerates the per-share blocks in
# /etc/higoos/webdav/higoos-dav.conf and reloads this unit.
ServerName higoos-webdav
ServerRoot /etc/apache2
PidFile /run/higoos-webdav.pid
Listen 8081
Mutex file:/var/lib/higoos/webdav

LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule unixd_module /usr/lib/apache2/modules/mod_unixd.so
LoadModule authn_core_module /usr/lib/apache2/modules/mod_authn_core.so
LoadModule authn_file_module /usr/lib/apache2/modules/mod_authn_file.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule authz_user_module /usr/lib/apache2/modules/mod_authz_user.so
LoadModule auth_basic_module /usr/lib/apache2/modules/mod_auth_basic.so
LoadModule dav_module /usr/lib/apache2/modules/mod_dav.so
LoadModule dav_fs_module /usr/lib/apache2/modules/mod_dav_fs.so
LoadModule alias_module /usr/lib/apache2/modules/mod_alias.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so

User www-data
Group www-data
DavLockDB /var/lib/higoos/webdav/DavLock
ErrorLog /var/log/higoos-webdav.error.log

# HiGoOS-managed share definitions (regenerated by the protocols domain).
IncludeOptional /etc/higoos/webdav/higoos-dav.conf
