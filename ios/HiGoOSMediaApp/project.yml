name: HiGoOSMediaApp
options:
  minimumXcodeGenVersion: 2.43.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  HiGoOSMediaApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - HiGoOSMediaApp
    info:
      path: HiGoOSMediaApp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiveton.higoos.mediaapp
        PRODUCT_NAME: HiGoOSMediaApp
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  HiGoOSMediaAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - HiGoOSMediaAppTests
    dependencies:
      - target: HiGoOSMediaApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiveton.higoos.mediaapp.tests
        GENERATE_INFOPLIST_FILE: YES
  HiGoOSMediaAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - HiGoOSMediaAppUITests
    dependencies:
      - target: HiGoOSMediaApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiveton.higoos.mediaapp.uitests
        GENERATE_INFOPLIST_FILE: YES
