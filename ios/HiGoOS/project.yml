name: HiGoOS
options:
  minimumXcodeGenVersion: 2.43.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  HiGoOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - HiGoOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiveton.higoos
        PRODUCT_NAME: HiGoOS
        INFOPLIST_FILE: HiGoOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  HiGoOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - HiGoOSTests
    dependencies:
      - target: HiGoOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiveton.higoos.tests
        GENERATE_INFOPLIST_FILE: YES
  HiGoOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - HiGoOSUITests
    dependencies:
      - target: HiGoOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiveton.higoos.uitests
        GENERATE_INFOPLIST_FILE: YES
